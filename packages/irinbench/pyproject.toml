[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "irinbench"
version = "0.4.20"
description = "Benchmark corpora and runs for IRIN: derive specs, score models, report drift."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "nevodesigns" }]
keywords = ["cad", "benchmark", "regression", "evaluation", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["irinspec", "irineval"]

[project.urls]
Homepage = "https://github.com/nevodesigns/irin"
Repository = "https://github.com/nevodesigns/irin"
Issues = "https://github.com/nevodesigns/irin/issues"

[project.scripts]
irinbench = "irinbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["irinbench*"]

[tool.setuptools.package-data]
irinbench = ["py.typed"]
